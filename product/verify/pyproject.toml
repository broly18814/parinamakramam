[project]
name = "parinama-verify"
version = "0.0.2"
description = "Independent, agent-agnostic verification of AI-written code changes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []  # standard library only (decision D-014)

[project.scripts]
pkv = "pkv.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pkv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # lets the tests find the pkv package from any folder
