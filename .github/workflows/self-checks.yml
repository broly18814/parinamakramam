# GitHub's robot (GitHub Actions) checks every upload and pull request.
# Plain words: an automatic second pair of eyes that never gets tired.
# Any failing job marks the upload with a red cross.
name: self-checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff check product/verify research/pevo experiments

  types:
    name: types (mypy --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - working-directory: product/verify
        run: uvx mypy --python-version 3.10 --strict pkv

  tests:
    name: tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
      - name: Research self-checks (puzzle world)
        working-directory: research/pevo
        run: python -m pytest -q tests
      - name: Checker tool self-checks (pkv)
        working-directory: product/verify
        run: python -m pytest -q tests

  benchmark:
    name: practice sets BENCH-001 + BENCH-002 (regression gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install pytest
      - working-directory: product/verify
        run: |
          python benchmark/run_benchmark.py --set bench001 --check --out /tmp/bench001
          python benchmark/run_benchmark.py --set bench002 --check --out /tmp/bench002

  dogfood:
    name: pkv checks this change (dogfooding the GitHub Action)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install pytest
      - run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
      - uses: ./product/verify
