# GitHub's robot (GitHub Actions) checks every upload and pull request.
# Plain words: an automatic second pair of eyes that never gets tired.
# Any failing job marks the upload with a red cross.
name: self-checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff check product/verify product/action research/pevo experiments
      - name: Licence files in the package match the root copies
        run: cmp LICENSE product/verify/LICENSE && cmp NOTICE product/verify/NOTICE

  types:
    name: types (mypy --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - working-directory: product/verify
        run: uvx mypy --python-version 3.10 --strict pkv

  tests:
    name: tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
      - name: Research self-checks (puzzle world)
        working-directory: research/pevo
        run: python -m pytest -q tests
      - name: Checker tool self-checks (pkv)
        working-directory: product/verify
        run: python -m pytest -q tests

  benchmark:
    name: practice sets BENCH-001, 002, 003 (regression gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install pytest
      - working-directory: product/verify
        run: |
          python benchmark/run_benchmark.py --set bench001 --check --out /tmp/bench001
          python benchmark/run_benchmark.py --set bench002 --check --out /tmp/bench002
          python benchmark/run_benchmark.py --set bench003 --check --out /tmp/bench003

  package:
    name: package builds, passes PyPI's checks, and installs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build --out-dir dist product/verify
      - run: uvx twine check --strict dist/*
      - run: |
          python3 -m venv /tmp/fresh
          /tmp/fresh/bin/pip install dist/*.whl
          /tmp/fresh/bin/pkv --version

  dogfood:
    name: pkv checks this change (dogfooding the GitHub Action)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install pytest
      - run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
      - uses: ./product/verify

  marketplace-action:
    name: the Marketplace copy of the action works (downloads pkv from PyPI, checks its fingerprint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install pytest
      - run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
      - uses: ./product/action

  published-action:
    name: the published action works, used the way a stranger would (pinned to its commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install pytest
      - run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
      - uses: broly18814/parinama-verify-action@57ada4841218a46d4166f3e0bc8de18ebe1912dd  # v0.2.1
