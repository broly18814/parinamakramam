# Lint rules for the whole repository (ruff: https://docs.astral.sh/ruff/).
# Plain words: an automatic reviewer that flags likely bugs, unused code and
# inconsistent style. CI fails if any rule below is broken.
target-version = "py310"
line-length = 120

[lint]
select = [
    "E", "W",   # pycodestyle: basic style errors and warnings
    "F",        # pyflakes: unused names, undefined names, real mistakes
    "I",        # isort: consistent import order
    "B",        # bugbear: patterns that are often bugs
    "UP",       # pyupgrade: modern Python syntax
    "SIM",      # simplify: needlessly complicated code
    "RUF",      # ruff's own checks
]
ignore = [
    "SIM108",   # if/else blocks are often clearer than one-line ternaries
]

[lint.per-file-ignores]
# The DSL uses the established type names L, I, FII, FIB from the research
# write-up (R001); renaming them would make the code harder to check against it.
"research/pevo/pevo/dsl.py" = ["E741"]
# TAMPER-BENCH case data: long string literals are whole lines of the projects' code,
# kept on one line so each case reads like the diff it is.
"benchmarks/tamper-bench/tamperbench/dev.py" = ["E501"]
"benchmarks/tamper-bench/tamperbench/projects.py" = ["E501"]
"benchmarks/tamper-bench/tests/test_tamperbench.py" = ["E501"]
# The results tables use typographic dashes and the multiplication sign on purpose.
"benchmarks/tamper-bench/tamperbench/run.py" = ["RUF001", "RUF002"]
